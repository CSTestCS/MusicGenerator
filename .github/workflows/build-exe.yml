name: Build Windows .exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe
        run: pyinstaller --noconfirm --clean WordSongStudio.spec

      - name: Smoke test the exe (render + export without the window)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\WordSongStudio.exe -ArgumentList "--selftest", "selftest.wav" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self test failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path selftest.wav)) { throw "self test did not write a wav" }
          Get-Item selftest.wav | Format-List Name, Length

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: WordSongStudio-windows
          path: dist/WordSongStudio.exe

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WordSongStudio.exe
